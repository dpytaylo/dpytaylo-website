name: CI

permissions:
  contents: read

env: 
  CARGO_TERM_COLOR: always
  
# This configuration allows maintainers of this repo to create a branch and pull request based on
# the new branch. Restricting the push trigger to the main branch ensures that the PR only gets
# built once.
on:
  push:
    branches:
      - main
  pull_request: {}

# If new code is pushed to a PR branch, then cancel in progress workflows for that PR. Ensures that
# we don't waste CI time, and returns results quicker.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Rustup
        run: rustup update nightly && rustup default nightly && rustup component add clippy && rustup component add rustfmt
      - name: Clippy
        run: cargo clippy --all --verbose
      - name: Format
        run: cargo fmt --all --check --verbose
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  ci-pass:
    name: CI is green
    runs-on: ubuntu-latest
    needs:
      - fmt
      - clippy
      - build
      - test
      - deny
      - spelling
    steps:
      - run: exit 0

  # Checks that the code is formatted according to rustfmt.
  fmt:
    name: stable / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo +stable fmt --check
        run: cargo +stable fmt --check

  # Checks that the code does not contain any clippy warnings.
  clippy:
    name: ${{ matrix.toolchain }} / clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Get early warning of new lints which are regularly introduced in beta channels.
        # toolchain: [stable, beta]
        toolchain: [nightly]

    steps:
      - uses: actions/checkout@v6
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Build our application
  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.toolchain }} / cargo build --verbose
    strategy:
      matrix:
        toolchain: [nightly]
    steps:
      - uses: actions/checkout@v6
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: cargo generate-lockfile
        # enable this ci template to run regardless of whether the lockfile is checked in or not
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - name: cargo build --verbose
        env:
          CI_RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo build --verbose

  # Runs the all-targets tests
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.toolchain }} / cargo test --locked --all-targets
    strategy:
      matrix:
        # TODO: run on stable and beta to ensure that tests won't break on the next version of the rust
        toolchain: [nightly]
    steps:
      - uses: actions/checkout@v6
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: cargo generate-lockfile
        # enable this ci template to run regardless of whether the lockfile is checked in or not
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - name: cargo test --all-targets
        env:
          CI_RUST_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo test --all-targets
  
  # 'cargo deny' to check for license and security issues.
  deny:
    name: stable / cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "stable"

  # Spell checks the codebase using the typos tool.
  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v6
    - name: Spell Check Repo
      uses: crate-ci/typos@v1.40.0
